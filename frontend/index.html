<!DOCTYPE html>
<html>
<head>
    <title>Docker Dashboard</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 30px; border-radius: 10px; display: inline-block; }
        .count { font-size: 40px; color: #4ade80; }
    </style>
</head>
<body>
    <div class="card">
        <h1>DevOps Docker App</h1>
        <p>Počet návštev v databáze Redis:</p>
        <div class="count" id="visits">Načítavam...</div>
    </div>
    <script>
        fetch('http://localhost:5001/api/stats')
            .then(res => res.json())
            .then(data => document.getElementById('visits').innerText = data.visits)
            .catch(() => document.getElementById('visits').innerText = "Chyba API");
    </script>
</body>
</html>
