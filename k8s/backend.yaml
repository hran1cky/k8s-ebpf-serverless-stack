apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: devops-backend:v1
        imagePullPolicy: Never   # Povie Kubernetesu, aby sťahoval obraz z Kind klastra a nie z Docker Hubu
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_HOST
          value: "redis-db"     # Presne toto meno má Service v redis.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
